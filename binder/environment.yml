name: biobb_wf_virtual-screening
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - biobb_io==5.3.2
  - biobb_structure_utils==5.3.0
  - biobb_vs==5.3.0
  - biobb_chemistry==5.3.2
  - openbabel==3.1.1  # 3.2.1 writes COMPND/AUTHOR into the .pdbqt and Vina rejects it
  - jupyterlab=3.6
  - nodejs=16
  - ipywidgets=7
  # ambertools 26 ships a dangling bin/amber.conda symlink that crashes
  # `mamba clean` (run by repo2docker); see conda-forge/ambertools-feedstock#193
  - ambertools<26
  - molviewspec>=1.8